name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run linter
        run: echo "Linting complete"

  build-package:
    runs-on: ubuntu-latest
    needs: test-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:latest .